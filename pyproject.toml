[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "checkup"
version = "0.1.0"
description = "A plain-language public security check for small organizations' email and websites"
readme = "checkup/README.md"
requires-python = ">=3.10"
dependencies = ["dnspython>=2.4"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
checkup = "checkup.cli:main"

[tool.setuptools]
packages = ["checkup"]
